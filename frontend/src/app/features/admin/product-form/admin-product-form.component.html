<div class="container" style="padding-top:32px; padding-bottom:48px; max-width:720px">
  <button mat-button routerLink="/admin/products"><mat-icon>arrow_back</mat-icon> Nazad</button>
  <h1 class="page-title" style="margin-top:16px">{{ isEdit ? 'Izmeni proizvod' : 'Novi proizvod' }}</h1>

  <div class="loading-wrapper" *ngIf="loading"><mat-spinner diameter="48"></mat-spinner></div>

  <mat-card *ngIf="!loading">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Naziv proizvoda</mat-label>
          <input matInput formControlName="name">
          <mat-error *ngIf="form.get('name')?.hasError('required')">Naziv je obavezan</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Opis</mat-label>
          <textarea matInput formControlName="description" rows="4"></textarea>
        </mat-form-field>

        <div class="two-col">
          <mat-form-field appearance="outline">
            <mat-label>Cena (RSD)</mat-label>
            <input matInput formControlName="price" type="number" min="0">
            <span matTextPrefix>RSD&nbsp;</span>
            <mat-error *ngIf="form.get('price')?.hasError('required')">Obavezno</mat-error>
            <mat-error *ngIf="form.get('price')?.hasError('min')">Min vrednost: 0.01</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Količina na stanju</mat-label>
            <input matInput formControlName="stockQuantity" type="number" min="0">
            <mat-error *ngIf="form.get('stockQuantity')?.hasError('required')">Obavezno</mat-error>
            <mat-error *ngIf="form.get('stockQuantity')?.hasError('min')">Min: 0</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Kategorija</mat-label>
          <mat-select formControlName="categoryId">
            <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('categoryId')?.hasError('required')">Kategorija je obavezna</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>URL slike</mat-label>
          <input matInput formControlName="imageUrl" placeholder="https://...">
          <mat-icon matPrefix>image</mat-icon>
        </mat-form-field>

        <img *ngIf="form.get('imageUrl')?.value" [src]="form.get('imageUrl')?.value"
             class="preview-img" alt="Preview">

        <div class="active-toggle">
          <label>Status:</label>
          <mat-select formControlName="active" style="width:140px">
            <mat-option [value]="true">Aktivan</mat-option>
            <mat-option [value]="false">Neaktivan</mat-option>
          </mat-select>
        </div>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/admin/products">Otkaži</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="saving">
            <mat-spinner diameter="20" *ngIf="saving"></mat-spinner>
            {{ saving ? 'Čuvanje...' : (isEdit ? 'Sačuvaj izmene' : 'Kreiraj proizvod') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

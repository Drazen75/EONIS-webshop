<div class="container" style="padding-top:32px; padding-bottom:48px">
  <h1 class="page-title">Upravljanje korisnicima</h1>

  <mat-form-field appearance="outline" style="width:100%; max-width:400px; margin-bottom:16px">
    <mat-label>Pretraži po imenu ili emailu</mat-label>
    <input matInput [formControl]="searchCtrl">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <div class="loading-wrapper" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner></div>

  <mat-card *ngIf="!loading">
    <table mat-table [dataSource]="users" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Ime i prezime</th>
        <td mat-cell *matCellDef="let u">{{ u.firstName }} {{ u.lastName }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
      </ng-container>
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Uloga</th>
        <td mat-cell *matCellDef="let u">
          <span class="role-chip" [class.admin]="u.role === 'ADMIN'">{{ u.role }}</span>
        </td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Telefon</th>
        <td mat-cell *matCellDef="let u">{{ u.phone || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let u">
          <span class="chip" [class.chip-active]="u.active" [class.chip-inactive]="!u.active">
            {{ u.active ? 'Aktivan' : 'Neaktivan' }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Registrovan</th>
        <td mat-cell *matCellDef="let u">{{ u.createdAt | date:'dd.MM.yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let u">
          <button mat-icon-button color="warn" *ngIf="u.active && u.role !== 'ADMIN'"
                  (click)="deactivate(u)" matTooltip="Deaktiviraj">
            <mat-icon>person_off</mat-icon>
          </button>
          <button mat-icon-button color="primary" *ngIf="!u.active"
                  (click)="activate(u)" matTooltip="Aktiviraj">
            <mat-icon>person</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [length]="total" [pageSize]="pageSize" [pageIndex]="page"
                   [pageSizeOptions]="[10,20,50]" (page)="onPage($event)" showFirstLastButtons>
    </mat-paginator>
  </mat-card>
</div>

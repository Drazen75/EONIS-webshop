<div class="container" style="padding-top:32px; padding-bottom:48px">
  <div class="page-header">
    <h1 class="page-title">Upravljanje proizvodima</h1>
    <a mat-raised-button color="primary" routerLink="/admin/products/new">
      <mat-icon>add</mat-icon> Novi proizvod
    </a>
  </div>

  <div class="filters-row">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Pretraži</mat-label>
      <input matInput [formControl]="searchCtrl">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Kategorija</mat-label>
      <mat-select [(ngModel)]="selectedCategory" (selectionChange)="page=0; load()">
        <mat-option [value]="null">Sve</mat-option>
        <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="loading-wrapper" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner></div>

  <mat-card *ngIf="!loading">
    <table mat-table [dataSource]="products" class="full-width">
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Slika</th>
        <td mat-cell *matCellDef="let p">
          <img [src]="p.imageUrl || 'https://placehold.co/60x45'" class="table-img">
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let p">{{ p.name }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Kategorija</th>
        <td mat-cell *matCellDef="let p">{{ p.category?.name }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Cena (RSD)</th>
        <td mat-cell *matCellDef="let p">{{ p.price | number:'1.0-0' }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Zalihe</th>
        <td mat-cell *matCellDef="let p">
          <span [class.text-warn]="p.stockQuantity < 3" [class.text-error]="p.stockQuantity === 0">
            {{ p.stockQuantity }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let p">
          <span class="chip" [class.chip-active]="p.active" [class.chip-inactive]="!p.active">
            {{ p.active ? 'Aktivan' : 'Neaktivan' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Akcije</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button color="primary" (click)="edit(p.id)" matTooltip="Izmeni">
            <mat-icon>edit</mat-icon>
          </button>
          <button *ngIf="p.active" mat-icon-button color="warn" (click)="delete(p)" matTooltip="Deaktiviraj">
            <mat-icon>block</mat-icon>
          </button>
          <button *ngIf="!p.active" mat-icon-button color="accent" (click)="activate(p)" matTooltip="Aktiviraj">
            <mat-icon>check_circle</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="total" [pageSize]="pageSize" [pageIndex]="page"
                   [pageSizeOptions]="[10,20,50]" (page)="onPage($event)" showFirstLastButtons>
    </mat-paginator>
  </mat-card>
</div>
